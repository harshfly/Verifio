services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - storage_data:/app/storage
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/verifio
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=/app/storage
    depends_on:
      - postgres
      - redis

  celery_worker:
    build: .
    command: celery -A app.tasks.celery_worker:celery_app worker --loglevel=info -P solo
    volumes:
      - .:/app
      - storage_data:/app/storage
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/verifio
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=/app/storage
      - TOKENIZERS_PARALLELISM=false
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: verifio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  storage_data:
